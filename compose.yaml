# The application and how its parts connect, on one internal network.
# Nothing is published here. Two overrides decide what is reachable:
#   compose.override.yaml  local development (Docker applies it automatically)
#   compose.deploy.yaml    the AWS demo: only Nginx, on 80 and 443
# Inside the network every service listens on its container interface.
#
# Memory limits are the budget for one 2 GiB t3.small (see the Checkpoint 7
# evidence): measured peaks under the demo workload, with headroom, leaving
# room for the OS and the monitoring added in Checkpoint 8.
name: one3d

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: one3d
      POSTGRES_USER: one3d
      # The local default matches application.yaml; the deployment sets its own.
      POSTGRES_PASSWORD: ${ONE3D_DB_PASSWORD:-one3d-local-dev}
    volumes:
      - one3d-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U one3d -d one3d"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped

  # The separate printer simulator (simulator/). Its journal survives restarts
  # in the one3d-simulator volume. Dev controls are off unless an override
  # turns them on (local development only).
  simulator:
    image: ${ONE3D_REGISTRY:-one3d}/one3d-simulator:${ONE3D_IMAGE_TAG:-local}
    build: ./simulator
    volumes:
      - one3d-simulator:/data
    mem_limit: 192m
    restart: unless-stopped

  backend:
    image: ${ONE3D_REGISTRY:-one3d}/one3d-backend:${ONE3D_IMAGE_TAG:-local}
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      simulator:
        condition: service_started
    environment:
      ONE3D_DB_URL: jdbc:postgresql://db:5432/one3d
      ONE3D_DB_USERNAME: one3d
      ONE3D_DB_PASSWORD: ${ONE3D_DB_PASSWORD:-one3d-local-dev}
      ONE3D_SIMULATOR_URL: http://simulator:8090
      # The heap may use 65% of the container's memory; the rest is metaspace,
      # threads and buffers.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65 -XX:+ExitOnOutOfMemoryError
    mem_limit: 640m
    restart: unless-stopped

  frontend:
    image: ${ONE3D_REGISTRY:-one3d}/one3d-frontend:${ONE3D_IMAGE_TAG:-local}
    build: ./frontend
    mem_limit: 192m
    restart: unless-stopped

volumes:
  one3d-db:
  one3d-simulator:
