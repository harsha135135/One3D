# Local development services: PostgreSQL, the printer simulator, a mock
# identity provider and S3-compatible file storage. The backend and frontend run on the host (see README).
# Checkpoint 7 adds the application containers and a deployment variant.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: one3d
      POSTGRES_USER: one3d
      # Local development only; matches the default in application.yaml.
      POSTGRES_PASSWORD: one3d-local-dev
    ports:
      # Published on the loopback interface only. The short form "5433:5432"
      # would listen on every host interface. 5433 avoids clashing with a
      # PostgreSQL server already installed on the host.
      - "127.0.0.1:5433:5432"
    volumes:
      - one3d-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U one3d -d one3d"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The separate printer simulator (simulator/). Its journal survives restarts
  # in the one3d-simulator volume. Dev controls (complete/fail/drop replies)
  # are for local development only, and the port is published on 127.0.0.1.
  simulator:
    build: ./simulator
    image: one3d-simulator:local
    environment:
      SIMULATOR_DEV_CONTROLS: "true"
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - one3d-simulator:/data

  # Local stand-in for the identity provider (Cognito on AWS): a mock OIDC
  # server with a login form where you type any username. Usernames starting
  # with "operator" get the operators group. Development only; the aws profile
  # uses Cognito. The issuer is http://localhost:8180/default.
  idp:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.5
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG: >-
        {"interactiveLogin": true, "httpServer": "NettyWrapper",
         "tokenCallbacks": [{"issuerId": "default", "tokenExpiry": 3600,
           "requestMappings": [
             {"requestParam": "subject", "match": "operator.*",
              "claims": {"sub": "$${subject}", "aud": ["$${clientId}"], "email": "$${subject}@example.test", "groups": ["operators"]}},
             {"requestParam": "subject", "match": ".*",
              "claims": {"sub": "$${subject}", "aud": ["$${clientId}"], "email": "$${subject}@example.test", "groups": []}}
           ]}]}
    ports:
      - "127.0.0.1:8180:8080"

  # Local stand-in for private S3 file storage (S3 on AWS). Files are kept in
  # the one3d-storage volume. It does not check signatures, expiry or the signed
  # Content-Length; real S3 does (verified on AWS in Checkpoint 7). The browser
  # reaches it only through the frontend's /s3 path.
  storage:
    image: adobe/s3mock:5.2
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: one3d-artifacts
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - one3d-storage:/s3mockroot

  # One-shot setup: turn on bucket versioning, which the application requires
  # (it pins the exact version of every upload). The application never creates
  # or configures the bucket; on AWS, Terraform does.
  storage-init:
    image: curlimages/curl:8.17.0
    depends_on:
      - storage
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until curl -sf -o /dev/null http://storage:9090/; do sleep 1; done;
        curl -sf -X PUT 'http://storage:9090/one3d-artifacts?versioning'
        -H 'Content-Type: application/xml'
        -d '<VersioningConfiguration xmlns="http://s3.amazonaws.com/doc/2006-03-01/"><Status>Enabled</Status></VersioningConfiguration>'
        && echo 'Bucket versioning enabled'

volumes:
  one3d-db:
  one3d-simulator:
  one3d-storage:
