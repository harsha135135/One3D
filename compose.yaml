# The application and how its parts connect, on one internal network.
# Nothing is published here. Two overrides decide what is reachable:
#   compose.override.yaml  local development (Docker applies it automatically)
#   compose.deploy.yaml    the AWS demo: only Nginx, on 80 and 443
# Inside the network every service listens on its container interface.
#
# Memory limits are the budget for one 2 GiB t3.small (see the Checkpoint 7
# evidence): measured peaks under the demo workload, with headroom, leaving
# room for the OS and the monitoring added in Checkpoint 8.
name: one3d

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: one3d
      POSTGRES_USER: one3d
      # The local default matches application.yaml; the deployment sets its own.
      POSTGRES_PASSWORD: ${ONE3D_DB_PASSWORD:-one3d-local-dev}
    volumes:
      - one3d-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U one3d -d one3d"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    restart: unless-stopped

  # The separate printer simulator (simulator/). Its journal survives restarts
  # in the one3d-simulator volume. Dev controls are off unless an override
  # turns them on (local development only).
  simulator:
    image: ${ONE3D_REGISTRY:-one3d}/one3d-simulator:${ONE3D_IMAGE_TAG:-local}
    build: ./simulator
    volumes:
      - one3d-simulator:/data
    mem_limit: 192m
    restart: unless-stopped

  backend:
    image: ${ONE3D_REGISTRY:-one3d}/one3d-backend:${ONE3D_IMAGE_TAG:-local}
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      simulator:
        condition: service_started
    environment:
      ONE3D_DB_URL: jdbc:postgresql://db:5432/one3d
      ONE3D_DB_USERNAME: one3d
      ONE3D_DB_PASSWORD: ${ONE3D_DB_PASSWORD:-one3d-local-dev}
      ONE3D_SIMULATOR_URL: http://simulator:8090
      # The heap may use 65% of the container's memory; the rest is metaspace,
      # threads and buffers.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65 -XX:+ExitOnOutOfMemoryError
      # One JSON object per log line (Elastic Common Schema), with request_id,
      # order_id, job_id, attempt_id, command_id or artifact_id where known.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    mem_limit: 640m
    restart: unless-stopped

  frontend:
    image: ${ONE3D_REGISTRY:-one3d}/one3d-frontend:${ONE3D_IMAGE_TAG:-local}
    build: ./frontend
    mem_limit: 192m
    restart: unless-stopped

  # Metrics (Checkpoint 8). Prometheus reads the backend's management port
  # (8081) on this network; Grafana shows the provisioned "One3D overview"
  # dashboard. Neither is published here (see the overrides), and Nginx does
  # not route to them.
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=512MB
    volumes:
      - ./infra/monitoring/prometheus:/etc/prometheus:ro
      - one3d-prometheus:/prometheus
    mem_limit: 192m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.12
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # The deployment sets its own (SSM); this default is for local use only.
      GF_SECURITY_ADMIN_PASSWORD: ${ONE3D_GRAFANA_ADMIN_PASSWORD:-local-dev-only}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/one3d-overview.json
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - one3d-grafana:/var/lib/grafana
    mem_limit: 192m
    restart: unless-stopped

volumes:
  one3d-db:
  one3d-simulator:
  one3d-prometheus:
  one3d-grafana:
