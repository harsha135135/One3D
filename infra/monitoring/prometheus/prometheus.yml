# Prometheus for the One3D demo (Checkpoint 8). It reads the backend's metrics
# on the internal Docker network (management port 8081, never published).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: one3d-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8081"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
