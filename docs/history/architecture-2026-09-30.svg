<text x="548" y="236" class="al" text-anchor="start">HTTPS + JWT</text>
<path d="M 710 174 V 248" class="a" marker-end="url(#ae)"/>
<path d="M 76 174 V 513" class="a" marker-end="url(#ae)"/>
<text x="84" y="262" class="al" text-anchor="start">HTTPS</text>
<path d="M 380 174 V 204 H 295 V 463 H 650 V 478" class="ad" marker-end="url(#ae)"/>
<text x="452" y="458" class="al" text-anchor="start">direct presigned upload → quarantine</text>
<path d="M 1120 145 H 1088 V 204 H 755 V 290 H 742" class="a" marker-end="url(#ae)"/>
<text x="1000" y="198" class="al" text-anchor="start">signed webhook</text>
<path d="M 490 282 H 518" class="a" marker-end="url(#ae)"/>
<path d="M 630 314 V 343" class="a" marker-end="url(#ae)"/>
<path d="M 435 445 V 478" class="a" marker-end="url(#ae)"/>
<text x="380" y="474" class="al" text-anchor="end">txn + outbox</text>
<path d="M 720 445 V 478" class="a" marker-end="url(#ae)"/>
<path d="M 925 445 V 478" class="a" marker-end="url(#ae)"/>
<path d="M 925 540 V 558" class="a" marker-end="url(#ae)"/>
<path d="M 1050 395 H 1098" class="a" marker-start="url(#as)" marker-end="url(#ae)"/>
<path d="M 435 620 V 650" class="a" marker-end="url(#ae)"/>
<text x="427" y="634" class="al" text-anchor="end">Streams</text>
<path d="M 560 697 H 578" class="a" marker-end="url(#ae)"/>
<path d="M 770 620 V 640 H 286" class="ap" marker-end="url(#ae)"/>
<text x="445" y="634" class="al" text-anchor="start">consent + editorial approval → sanitized copy</text>
<path d="M 700 742 V 778 H 300 V 838" class="a" marker-start="url(#as)" marker-end="url(#ae)"/>
<text x="312" y="793" class="al" text-anchor="start">MQTT/mTLS · command notify + ordered events · short-lived S3 GET for approved artifacts</text>
<path d="M 470 890 H 528" class="a" marker-end="url(#ae)"/>
<path d="M 790 890 H 848" class="a" marker-end="url(#ae)"/>
<path d="M 660 940 V 970" class="a" marker-end="url(#ae)"/>
<path d="M 1160 890 H 1112" class="a" marker-end="url(#ae)"/>
<text x="1136" y="882" class="al" text-anchor="middle">bed clear</text>
<line x1="40" y1="1120" x2="80" y2="1120" class="a" marker-end="url(#ae)"/><text x="88" y="1124" class="lg">request / command / event</text>
<line x1="290" y1="1120" x2="330" y2="1120" class="ad" marker-end="url(#ae)"/><text x="338" y="1124" class="lg">direct data transfer (presigned S3)</text>
<line x1="590" y1="1120" x2="630" y2="1120" class="ap" marker-end="url(#ae)"/><text x="638" y="1124" class="lg">publication (consent-gated)</text>
<rect x="850" y="1111" width="30" height="18" rx="4" class="crit"/><text x="888" y="1124" class="lg">physical-safety boundary: never auto-reassign a possibly-started attempt</text>
<text x="40" y="1150" class="lg2">Later: containerised slicing on ECS/Fargate or Batch · EventBridge fan-out · multi-farm scheduling — only when measured demand justifies it.</text>
