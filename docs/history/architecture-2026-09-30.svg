.lg{font:400 12px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#3b4150}
.lg2{font:italic 12px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#666}
</style>
<defs>
<marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b4150"/></marker>
<marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b4150"/></marker>
</defs>
<rect width="1440" height="1170" fill="#ffffff"/>
<text x="40" y="38" class="title">One3D by OneCreations · PrintFlow — System Architecture</text>
<text x="40" y="60" class="sub">MVP → first connected printers · durable command ownership, recoverable edge execution, honest material records</text>
<rect x="40" y="76" width="1040" height="118" rx="12" fill="#F3F6FB" stroke="#5B6F99" stroke-width="1.5"/>
<text x="54" y="98" class="zone" fill="#5B6F99">CLIENTS</text>
<rect x="60" y="110" width="240" height="64" rx="8" class="box"/>
<text x="72" y="132" class="t">OneCreations visitors</text>
<text x="72" y="150" class="l">public portfolio · stories</text>
<rect x="360" y="110" width="260" height="64" rx="8" class="box"/>
<text x="372" y="132" class="t">One3D customer web</text>
<text x="372" y="150" class="l">uploads · orders · approvals · credits</text>
<rect x="680" y="110" width="380" height="64" rx="8" class="box"/>
<text x="692" y="132" class="t">Operator console (Cognito + MFA, roles)</text>
<text x="692" y="150" class="l">quotes · plan approval · assignment · QC · material intake</text>
<rect x="1100" y="76" width="300" height="470" rx="12" fill="#F6F6F6" stroke="#777777" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1114" y="98" class="zone" fill="#777777">EXTERNAL SERVICES</text>
<rect x="1120" y="112" width="260" height="66" rx="8" class="box"/>
<text x="1132" y="134" class="t">Payment provider</text>
<text x="1132" y="152" class="l">signed webhooks · dedupe by event id</text>
<rect x="1120" y="192" width="260" height="82" rx="8" class="box"/>
<text x="1132" y="214" class="t">AI concept / 3D vendors</text>
<text x="1132" y="232" class="l">behind adapter · budget caps</text>
<text x="1132" y="247" class="l">query existing job before retry</text>
<rect x="1120" y="288" width="260" height="52" rx="8" class="box"/>
<text x="1132" y="310" class="t">Email provider</text>
<text x="1132" y="328" class="l">order &amp; approval notifications</text>
<rect x="1120" y="354" width="260" height="82" rx="8" class="box"/>
<text x="1132" y="376" class="t">Registered recycling partner</text>
<text x="1132" y="394" class="l">pickups · receipts · processing</text>
<text x="1132" y="409" class="l">evidence (not EPR by default)</text>
<rect x="1120" y="450" width="260" height="66" rx="8" class="box"/>
<text x="1132" y="472" class="t">Courier / shipping</text>
<text x="1132" y="490" class="l">tracking · delivery status</text>
<rect x="40" y="214" width="1040" height="546" rx="12" fill="#FFF8EE" stroke="#C27C0E" stroke-width="1.5"/>
<text x="770" y="236" class="zone" fill="#C27C0E">AWS — ONE3D PRODUCTION ACCOUNT</text>
<rect x="100" y="254" width="180" height="196" rx="8" class="note"/>
<text x="112" y="276" class="tn">Environments</text>
<text x="112" y="294" class="l">separate test &amp; prod</text>
<text x="112" y="309" class="l">accounts (or isolated</text>
<text x="112" y="324" class="l">stacks + roles)</text>
<text x="112" y="339" class="l"></text>
<text x="112" y="354" class="l">GitHub OIDC → SAM</text>
<text x="112" y="369" class="l">least-privilege deploys</text>
<text x="112" y="384" class="l">no prod data for dev roles</text>
<rect x="310" y="250" width="180" height="64" rx="8" class="box"/>
<text x="322" y="272" class="t">Cognito</text>
<text x="322" y="290" class="l">customers · operators</text>
<rect x="520" y="250" width="220" height="64" rx="8" class="box"/>
<text x="532" y="272" class="t">HTTP API Gateway</text>
<text x="532" y="290" class="l">JWT authz · idempotency keys</text>
<rect x="770" y="250" width="280" height="64" rx="8" class="box"/>
<text x="782" y="272" class="t">Secrets Manager · KMS</text>
<text x="782" y="290" class="l">vendor keys · encryption at rest</text>
<rect x="310" y="345" width="740" height="100" rx="8" class="box"/>
<text x="322" y="367" class="t">Lambda application modules  (one repo · few deploy units · stateless)</text>
<text x="322" y="385" class="l">orders · design revisions · quotes · payments · shipments</text>
<text x="322" y="400" class="l">production release · assignment · reconciliation · reprint authorization</text>
<text x="322" y="415" class="l">QC · finishing · material intake · credit ledger · explicit domain transition function</text>
<rect x="310" y="480" width="250" height="140" rx="8" class="box"/>
<text x="322" y="502" class="t">DynamoDB</text>
<text x="322" y="520" class="l">Orders · items · design revisions</text>
<text x="322" y="535" class="l">Jobs · attempts · commands</text>
<text x="322" y="550" class="l">Printer state (conditional writes)</text>
<text x="322" y="565" class="l">Credits ledger · material batches</text>
<text x="322" y="580" class="l">Idempotency records · outbox</text>
<rect x="580" y="480" width="200" height="140" rx="8" class="box"/>
<text x="592" y="502" class="t">S3 private (versioned)</text>
<text x="592" y="520" class="l">quarantine/ → approved/</text>
<text x="592" y="535" class="l">photos · meshes · 3MF</text>
<text x="592" y="550" class="l">pinned version + SHA-256</text>
<text x="592" y="565" class="l">short-TTL presigned URLs</text>
<rect x="800" y="480" width="250" height="60" rx="8" class="box"/>
<text x="812" y="502" class="t">SQS + DLQ</text>
<text x="812" y="520" class="l">validation · preparation · notify</text>
<rect x="800" y="560" width="250" height="60" rx="8" class="box"/>
<text x="812" y="582" class="t">Step Functions (Standard)</text>
<text x="812" y="600" class="l">validate → prepare → operator review</text>
<rect x="310" y="652" width="250" height="90" rx="8" class="box"/>
<text x="322" y="674" class="t">Outbox publisher</text>
<text x="322" y="692" class="l">DynamoDB Streams trigger</text>
<text x="322" y="707" class="l">+ sweeper for pending items</text>
<text x="322" y="722" class="l">consumers dedupe on eventId</text>
<rect x="580" y="652" width="280" height="90" rx="8" class="box"/>
<text x="592" y="674" class="t">AWS IoT Core</text>
<text x="592" y="692" class="l">MQTT over mTLS · X.509 per bridge</text>
<text x="592" y="707" class="l">notifications → durable commands</text>
<text x="592" y="722" class="l">rules → Lambda (acks, telemetry)</text>
<rect x="880" y="652" width="170" height="90" rx="8" class="box"/>
<text x="892" y="674" class="t">Observability</text>
<text x="892" y="692" class="l">JSON logs (no PII) · EMF</text>
<text x="892" y="707" class="l">OTel/ADOT → X-Ray</text>
<text x="892" y="722" class="l">alarms: stale bridge,</text>
<text x="892" y="737" class="l">outbox age, DLQ depth</text>
<rect x="56" y="480" width="228" height="262" rx="10" fill="#F7F0FB" stroke="#8A5AA8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="90" y="500" class="zone" fill="#8A5AA8">ONECREATIONS (PARENT)</text>
<rect x="70" y="515" width="200" height="64" rx="8" class="box"/>
<text x="82" y="537" class="t">Next.js · DO App Platform</text>
<text x="82" y="555" class="l">separate repo + deploy</text>
<rect x="70" y="596" width="200" height="82" rx="8" class="box"/>
<text x="82" y="618" class="t">git-as-CMS content</text>
<text x="82" y="636" class="l">sanitised assets only</text>
<text x="82" y="651" class="l">never reads One3D data</text>
<rect x="40" y="800" width="1360" height="290" rx="12" fill="#EEF7F0" stroke="#3C8A55" stroke-width="1.5"/>
<text x="520" y="822" class="zone" fill="#3C8A55">PRINT FARM (EDGE) — OUTBOUND CONNECTIONS ONLY · LOCAL FIRMWARE OWNS MACHINE SAFETY</text>
<rect x="70" y="840" width="400" height="170" rx="8" class="crit"/>
<text x="82" y="862" class="t">Bridge service (local PC)</text>
<text x="82" y="880" class="l">SQLite command journal (durable)</text>
<text x="82" y="895" class="l">preconditions: idle · bed clear · material/profile</text>
<text x="82" y="910" class="l">  · assignment generation still current</text>
<text x="82" y="925" class="l">record START_INTENT before machine I/O</text>
<text x="82" y="940" class="l">same commandId → return stored result</text>
<text x="82" y="955" class="l">events: bridgeEpoch + monotonic seq</text>
<text x="82" y="970" class="l">restart → reconcile journal vs machine</text>
<rect x="530" y="840" width="260" height="100" rx="8" class="box"/>
<text x="542" y="862" class="t">Printer adapters</text>
<text x="542" y="880" class="l">advertise capabilities</text>
<text x="542" y="895" class="l">monitor · upload · start (if supported)</text>
<text x="542" y="910" class="l">no generic startPrint() assumed</text>
<rect x="850" y="840" width="260" height="100" rx="8" class="box"/>
<text x="862" y="862" class="t">Printers</text>
<text x="862" y="880" class="l">Bambu X1C (no AMS): monitor +</text>
<text x="862" y="895" class="l">  operator-confirmed start</text>
<text x="862" y="910" class="l">more machines only after</text>
<text x="862" y="925" class="l">  measured purchase gate</text>
<rect x="530" y="972" width="260" height="86" rx="8" class="box"/>
<text x="542" y="994" class="t">Printer simulator</text>
<text x="542" y="1012" class="l">failure injection for tests/demos</text>
<text x="542" y="1027" class="l">always labelled simulated</text>
<rect x="850" y="972" width="260" height="86" rx="8" class="box"/>
<text x="862" y="994" class="t">Local slicing / mesh worker</text>
<text x="862" y="1012" class="l">versioned slicer profiles</text>
<text x="862" y="1027" class="l">never runs customer G-code</text>
<rect x="1160" y="840" width="220" height="100" rx="8" class="box"/>
<text x="1172" y="862" class="t">Farm operator</text>
<text x="1172" y="880" class="l">bed-clear confirmation</text>
<text x="1172" y="895" class="l">part QC → finishing</text>
<text x="1172" y="910" class="l">→ final QC → pack</text>
<rect x="1160" y="972" width="220" height="86" rx="8" class="box"/>
<text x="1172" y="994" class="t">Material intake station</text>
<text x="1172" y="1012" class="l">verified scale · tare · bins</text>
<text x="1172" y="1027" class="l">gross / tare / net · evidence</text>
