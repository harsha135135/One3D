<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1170" viewBox="0 0 1440 1170" font-family="Helvetica, Arial, sans-serif">
<title>One3D by OneCreations / PrintFlow system architecture</title>
<style>
.title{font:700 22px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#1d2330}
.sub{font:400 13px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#555}
.zone{font:700 11.5px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;letter-spacing:.06em}
.box{fill:#fff;stroke:#5a6070;stroke-width:1.2}
.note{fill:#fffdf7;stroke:#c9b48a;stroke-width:1;stroke-dasharray:4 3}
.crit{fill:#fff;stroke:#C0392B;stroke-width:2.4}
.t{font:700 13.5px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#1d2330}
