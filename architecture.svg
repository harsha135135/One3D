<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
  <title id="title">One3D V1 — planned portfolio architecture</title>
  <desc id="desc">One customer and operator frontend connects through Nginx to one Spring Boot backend. PostgreSQL holds business records. Private S3, Cognito and test payments are external integrations. A separately restartable simulator uses a durable SQLite journal. Docker Compose, CI, Terraform and monitoring support one small demonstration environment. No components are implemented yet.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#626a78"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #17212e; }
      .heading { font-size: 28px; font-weight: 700; }
      .title { font-size: 18px; font-weight: 650; }
      .body { font-size: 15px; }
      .small { font-size: 13px; fill: #475569; }
      .box { fill: #fff; stroke: #64748b; stroke-width: 1.3; rx: 8; }
      .line { fill: none; stroke: #626a78; stroke-width: 1.8; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="880" fill="#f8fafc"/>
  <text class="heading" x="44" y="49">One3D V1 · a bounded portfolio application</text>
  <text class="body" x="44" y="79">Implemented (checkpoints 1–8); owner review pending · 13 October 2026 · one product / one custom STL / one simulated printer</text>
  <rect x="30" y="110" width="820" height="594" rx="12" fill="#eef2f6" stroke="#cbd5e1"/>
  <text class="small" x="50" y="136">ONE LOCAL STACK / ONE SMALL EC2 DEMO · DOCKER COMPOSE</text>

  <rect class="box" x="65" y="160" width="745" height="76"/>
  <text class="title" x="85" y="191">Customer + operator frontend</text>
  <text class="body" x="85" y="217">Next.js / React / TypeScript · one3d.store and /ops · minimal responsive screens</text>
  <path class="line" d="M437 236 V266"/>
  <rect class="box" x="65" y="268" width="745" height="66"/>
  <text class="title" x="85" y="296">Nginx</text>
  <text class="body" x="85" y="321">HTTPS and same-origin routing · only intended web endpoints are public</text>
  <path class="line" d="M437 334 V364"/>
  <rect class="box" x="65" y="366" width="745" height="127"/>
  <text class="title" x="85" y="395">Java 21 + Spring Boot · one modular backend</text>
  <text class="body" x="85" y="423">Identity · catalog · requests · quotes · orders · payments · production · files</text>
  <text class="body" x="85" y="449">Backend authorization · transactions · immutable revisions · explicit release</text>
  <text class="small" x="85" y="476">Small durable worker uses PostgreSQL pending-work rows; no broker is required</text>
  <path class="line" d="M240 493 V547"/>
  <path class="line" d="M635 493 V547"/>
  <text class="small" x="651" y="526">private HTTP</text>
  <rect class="box" x="65" y="550" width="345" height="119"/>
  <text class="title" x="85" y="581">PostgreSQL</text>
  <text class="body" x="85" y="609">JPA + Flyway · orders and attempts</text>
  <text class="body" x="85" y="634">Constraints · audit · pending work</text>
  <text class="small" x="85" y="655">Persisted volume; verified backup/restore</text>
  <rect class="box" x="460" y="550" width="350" height="119"/>
  <text class="title" x="480" y="581">One printer simulator</text>
  <text class="body" x="480" y="609">Separate Java process + SQLite journal</text>
  <text class="body" x="480" y="634">Stable command IDs · restart exercises</text>
  <text class="small" x="480" y="655">No physical printer control</text>

  <text class="small" x="880" y="136">EXTERNAL INTEGRATIONS</text>
  <rect class="box" x="880" y="160" width="285" height="106"/>
  <text class="title" x="900" y="189">Cognito</text>
  <text class="body" x="900" y="216">OIDC login via Spring Security</text>
  <text class="small" x="900" y="244">Customer / operator permissions</text>
  <rect class="box" x="880" y="290" width="285" height="120"/>
  <text class="title" x="900" y="319">Private S3</text>
  <text class="body" x="900" y="346">Authorized direct upload</text>
  <text class="body" x="900" y="371">Exact object version + SHA-256</text>
  <text class="small" x="900" y="395">One STL / revision · up to 20 MB</text>
  <rect class="box" x="880" y="434" width="285" height="112"/>
  <text class="title" x="900" y="463">Razorpay test mode</text>
  <text class="body" x="900" y="490">Verified, deduplicated webhooks</text>
  <text class="small" x="900" y="519">No real customer money</text>
  <path class="line" d="M810 397 H862 V213 H880"/>
  <path class="line" d="M810 429 H868 V350 H880"/>
  <path class="line" d="M810 461 H850 V490 H880"/>
  <text class="small" x="886" y="590">Lines summarize dependencies;</text>
  <text class="small" x="886" y="610">browser uploads use signed S3 access.</text>

  <rect x="30" y="726" width="1135" height="117" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text class="title" x="50" y="757">Bounded delivery and operations exercises</text>
  <text class="body" x="50" y="786">GitHub Actions: checks + traceable image · Terraform: one demo environment · scoped IAM</text>
  <text class="body" x="50" y="811">Prometheus + Grafana: a few metrics, one dashboard, one diagnosed failure · private operational ports</text>
  <text class="small" x="50" y="833">Optional labs: Ansible, Jenkins, RabbitMQ, Kafka, Kubernetes. None is required for V1 acceptance.</text>
  <text class="small" x="44" y="868">Scope authority: docs/v1-scope.md · Completion requires working code, evidence, personal understanding and owner signoff.</text>
</svg>
