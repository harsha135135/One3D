# Checks every pull request and every push to main. A PR is merged only after
# all jobs pass. Image builds and deployment are added in Checkpoint 7.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  simulator:
    name: Simulator tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: simulator/pom.xml
      - name: Unit and HTTP tests
        run: ./mvnw -B verify

  backend:
    name: Backend tests (PostgreSQL and simulator containers)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      # Testcontainers starts PostgreSQL and builds the simulator image from
      # ../simulator/Dockerfile; the runner provides Docker.
      - name: Unit and integration tests
        run: ./mvnw -B verify
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 14

  frontend:
    name: Frontend checks (lint, build, types, browser smoke tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact dependencies (package-lock.json)
        run: npm ci
      - name: Lint
        run: npm run lint
      # The build also generates next-env.d.ts, which the type check needs.
      - name: Build
        run: npm run build
      - name: Type check
        run: npm run typecheck
      - name: Browser smoke tests (API mocked; desktop and 390 px)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
