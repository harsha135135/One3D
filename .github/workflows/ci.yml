# Checks every pull request and every push to main. A PR is merged only after
# all jobs pass. Every run also builds the three images (x86, as on the demo
# instance). On a push to main, and only after every test job has passed, the
# images are pushed to ECR tagged with the commit SHA (tags are immutable) and
# that commit is deployed to the demo through SSM. AWS access uses GitHub's
# OIDC token and a role that only main can assume; no AWS keys are stored here.
# The jobs that need AWS are skipped until the repository variables exist.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  simulator:
    name: Simulator tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: simulator/pom.xml
      - name: Unit and HTTP tests
        run: ./mvnw -B verify

  backend:
    name: Backend tests (PostgreSQL, simulator and S3Mock containers)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      # Testcontainers starts PostgreSQL and builds the simulator image from
      # ../simulator/Dockerfile; the runner provides Docker.
      - name: Unit and integration tests
        run: ./mvnw -B verify
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 14

  frontend:
    name: Frontend checks (lint, build, types, browser smoke tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact dependencies (package-lock.json)
        run: npm ci
      - name: Lint
        run: npm run lint
      # The build also generates next-env.d.ts, which the type check needs.
      - name: Build
        run: npm run build
      - name: Type check
        run: npm run typecheck
      - name: Browser smoke tests (API mocked; desktop and 390 px)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

  images:
    name: Images (built on every run; pushed to ECR from main)
    needs: [simulator, backend, frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != '' }}
      REGISTRY: ${{ vars.ECR_REGISTRY || 'one3d' }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: AWS credentials (OIDC, main only)
        if: env.PUSH == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Log in to ECR
        if: env.PUSH == 'true'
        uses: aws-actions/amazon-ecr-login@v2
      - name: Backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: ${{ env.PUSH == 'true' }}
          provenance: false
          tags: ${{ env.REGISTRY }}/one3d-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: ${{ env.PUSH == 'true' }}
          provenance: false
          tags: ${{ env.REGISTRY }}/one3d-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Simulator image
        uses: docker/build-push-action@v7
        with:
          context: simulator
          push: ${{ env.PUSH == 'true' }}
          provenance: false
          tags: ${{ env.REGISTRY }}/one3d-simulator:${{ github.sha }}
          cache-from: type=gha,scope=simulator
          cache-to: type=gha,scope=simulator,mode=max
      - name: Deploy bundle (Compose files, Nginx, deploy script) to S3
        if: env.PUSH == 'true'
        run: |
          tar -czf "$RUNNER_TEMP/bundle.tar.gz" compose.yaml compose.deploy.yaml infra/nginx/bootstrap infra/nginx/https \
            infra/monitoring infra/deploy
          aws s3 cp "$RUNNER_TEMP/bundle.tar.gz" "s3://${{ vars.OPS_BUCKET }}/deploy/${{ github.sha }}.tar.gz" --only-show-errors

  deploy:
    name: Deploy to the demo (main only)
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    # One deploy at a time; a newer push waits rather than cancelling one in progress.
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy this commit through SSM
        env:
          DEMO_INSTANCE_ID: ${{ vars.DEMO_INSTANCE_ID }}
          OPS_BUCKET: ${{ vars.OPS_BUCKET }}
        run: infra/deploy/remote-deploy.sh "${{ github.sha }}"
