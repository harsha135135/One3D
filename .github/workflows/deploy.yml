# Kept as a clear failure for historical commands. The AWS publishing role must
# also lose SendCommand: editing a workflow alone cannot protect the demo.
name: Recruiter deployment requires owner promotion

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Historical input; this workflow no longer deploys
        required: false
        type: string

permissions:
  contents: read

jobs:
  owner-promotion-required:
    runs-on: ubuntu-24.04
    steps:
      - name: Explain the release boundary
        run: |
          echo "::error::GitHub Actions cannot deploy the frozen recruiter demo. Use the reviewed release manifest and infra/deploy/remote-deploy.sh from an owner-authenticated terminal after approval."
          exit 1
