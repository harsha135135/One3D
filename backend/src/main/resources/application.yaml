spring:
  application:
    name: one3d-backend
  datasource:
    # Local development defaults match compose.yaml. Override with environment
    # variables outside local development; never commit real credentials.
    url: ${ONE3D_DB_URL:jdbc:postgresql://127.0.0.1:5433/one3d}
    username: ${ONE3D_DB_USERNAME:one3d}
    password: ${ONE3D_DB_PASSWORD:one3d-local-dev}
  security:
    oauth2:
      client:
        # One OIDC client called "oidc". Endpoints are explicit (no discovery
        # call at startup); the defaults point at the local mock identity
        # provider from compose.yaml. The aws profile points them at Cognito.
        registration:
          oidc:
            client-id: ${ONE3D_OIDC_CLIENT_ID:one3d-local}
            client-secret: ${ONE3D_OIDC_CLIENT_SECRET:local-dev-only}
            authorization-grant-type: authorization_code
            scope: openid,email,profile
            redirect-uri: ${one3d.public-url}/login/oauth2/code/{registrationId}
            client-name: One3D
        provider:
          oidc:
            authorization-uri: ${ONE3D_OIDC_AUTHORIZATION_URI:${one3d.identity.issuer}/authorize}
            token-uri: ${ONE3D_OIDC_TOKEN_URI:${one3d.identity.issuer}/token}
            jwk-set-uri: ${ONE3D_OIDC_JWK_SET_URI:${one3d.identity.issuer}/jwks}
            user-info-uri: ${ONE3D_OIDC_USER_INFO_URI:${one3d.identity.issuer}/userinfo}
            user-name-attribute: sub
  jackson:
    deserialization:
      # Reject JSON numbers with a fraction or exponent (1.5, 1.0, 1e0) for
      # integer fields instead of silently truncating them to 1.
      accept-float-as-int: false
  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    # Database access happens inside service transactions, not while
    # rendering HTTP responses.
    open-in-view: false

server:
  # The API listens on the loopback interface only, so it is never reached
  # without the HTTPS proxy (Checkpoint 7), even though sign-in exists since
  # Checkpoint 4. Containers override this with SERVER_ADDRESS.
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      cookie:
        # The session cookie is never readable by JavaScript; it is Secure
        # (HTTPS only) in the aws profile.
        http-only: true
        same-site: lax

one3d:
  # The address people open in the browser (frontend and API share it).
  # Sign-in returns here, and the OIDC redirect URI is built from it.
  public-url: ${ONE3D_PUBLIC_URL:http://localhost:3000}
  identity:
    # ID tokens must come from exactly this issuer.
    issuer: ${ONE3D_OIDC_ISSUER:http://localhost:8180/default}
    # Claim listing the user's groups: "groups" locally, "cognito:groups" on AWS.
    groups-claim: ${ONE3D_OIDC_GROUPS_CLAIM:groups}
    operator-group: operators
  simulator:
    # The separate printer simulator process (simulator/). Never public.
    base-url: ${ONE3D_SIMULATOR_URL:http://127.0.0.1:8090}
    connect-timeout: 1s
    request-timeout: 3s
  worker:
    # Background work: delivery of start commands, polling of running prints
    # and checking uploaded files.
    enabled: true
    poll-interval: 1s
    batch-size: 10
    # A claimed row is reclaimable after this long, if its worker disappeared.
    lease: 30s
    # Tries per start command before the row is EXHAUSTED and shown to operators.
    max-attempts: 5
    # Wait before the 2nd try; doubled for each later try.
    retry-backoff: 2s
  storage:
    # Private, versioned object storage for uploaded models: S3 on AWS, the
    # S3Mock container from compose.yaml locally. The application never creates
    # or configures the bucket; Terraform (AWS) or compose.yaml (local) does.
    bucket: ${ONE3D_STORAGE_BUCKET:one3d-artifacts}
    region: ${ONE3D_STORAGE_REGION:ap-south-1}
    # Where the backend reaches storage. Empty means AWS S3 itself.
    endpoint: ${ONE3D_STORAGE_ENDPOINT:http://127.0.0.1:9090}
    # Where presigned URLs point: the browser uploads and downloads there.
    # Locally that is the frontend's /s3 path, which Next.js forwards to S3Mock
    # (same origin, so no CORS). Empty means AWS S3 itself.
    public-endpoint: ${ONE3D_STORAGE_PUBLIC_ENDPOINT:http://localhost:3000/s3}
    path-style: ${ONE3D_STORAGE_PATH_STYLE:true}
    # For the local mock only. Empty means the AWS default credentials chain
    # (the instance role on AWS); real keys are never configured here.
    access-key: ${ONE3D_STORAGE_ACCESS_KEY:local-dev-only}
    secret-key: ${ONE3D_STORAGE_SECRET_KEY:local-dev-only}
    upload-ttl: 15m
    download-ttl: 5m
  files:
    # V1 accepts one STL of at most 20 MiB per submission revision.
    max-upload-bytes: 20971520
    # Tries to read and check an uploaded file before the work is EXHAUSTED.
    verify-max-attempts: 5
  demo:
    # Demo-only shortcut that confirms an order without payment
    # (POST /api/demo/orders/{id}/simulate-payment). Off by default; the "demo"
    # profile turns it on. Checkpoint 6 replaces it with test-mode payments.
    simulated-payment-enabled: false
